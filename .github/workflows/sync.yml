name: Sync Woo Pickup Orders to Smartsheet

on:
  schedule:
    # Every 2 hours, daytime Mountain Time (13:00-01:00 UTC covers ~6am-6pm MT/MDT)
    - cron: '0 13,15,17,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      fetch_after:
        description: 'Pull orders placed on/after this date (YYYY-MM-DD). Leave blank for the normal season start (2026-04-01).'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          WOO_SITE_URL: ${{ secrets.WOO_SITE_URL }}
          WOO_CONSUMER_KEY: ${{ secrets.WOO_CONSUMER_KEY }}
          WOO_CONSUMER_SECRET: ${{ secrets.WOO_CONSUMER_SECRET }}
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
          # Only set WOO_FETCH_AFTER if the manual "fetch_after" input was provided;
          # on scheduled runs (no manual input) this stays empty and woo_client.py
          # falls back to its built-in default (2026-04-01).
          WOO_FETCH_AFTER: ${{ github.event.inputs.fetch_after && format('{0}T00:00:00', github.event.inputs.fetch_after) || '' }}
        run: python main.py
